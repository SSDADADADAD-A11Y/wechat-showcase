[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/logs"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/chat"
  status = 200
