<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聊天记录 - 视觉便签</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; padding: 16px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: #1a1a2e; margin: 20px 0; }
    .login { background: #fff; padding: 40px; border-radius: 12px; text-align: center; max-width: 360px; margin: 80px auto; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .login input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 12px; }
    .login button { width: 100%; padding: 12px; background: #07C160; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .day { background: #fff; border-radius: 12px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
    .day__header { background: #07C160; color: #fff; padding: 12px 16px; font-weight: 700; font-size: 14px; }
    .conversation { padding: 0; }
    .msg { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
    .msg:last-child { border-bottom: none; }
    .msg__time { font-size: 11px; color: #999; margin-bottom: 4px; }
    .msg__label { font-size: 11px; font-weight: 700; margin-bottom: 4px; display: inline-block; padding: 1px 8px; border-radius: 4px; }
    .msg__label--user { background: #e8f8ef; color: #07C160; }
    .msg__label--bot { background: #f0f0f0; color: #666; }
    .msg__text { font-size: 14px; line-height: 1.6; color: #333; white-space: pre-wrap; }
    .empty { text-align: center; padding: 60px 20px; color: #999; }
    .logout { text-align: center; margin-bottom: 16px; }
    .logout button { background: none; border: 1px solid #ddd; padding: 6px 16px; border-radius: 6px; color: #666; cursor: pointer; font-size: 13px; }
    .refresh { text-align: center; margin-bottom: 12px; }
    .refresh button { background: none; border: 1px solid #07C160; padding: 6px 16px; border-radius: 6px; color: #07C160; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container" id="app"></div>
  <script>
    const PWD_KEY = 'admin_pwd';
    let password = localStorage.getItem(PWD_KEY) || '';

    function login() {
      password = document.getElementById('pwd').value;
      localStorage.setItem(PWD_KEY, password);
      render();
    }

    function logout() {
      localStorage.removeItem(PWD_KEY);
      password = '';
      render();
    }

    async function loadLogs() {
      try {
        const res = await fetch(`/api/logs?pwd=${encodeURIComponent(password)}`);
        if (!res.ok) throw new Error('auth');
        return await res.json();
      } catch {
        return null;
      }
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    async function render() {
      const app = document.getElementById('app');

      if (!password) {
        app.innerHTML = `<div class="login">
          <h2 style="margin-bottom:20px">🔐 管理员登录</h2>
          <input id="pwd" type="password" placeholder="请输入管理密码" />
          <button onclick="login()">进入</button>
        </div>`;
        return;
      }

      const data = await loadLogs();
      if (!data) {
        app.innerHTML = `<div class="login">
          <h2 style="margin-bottom:20px">❌ 密码错误</h2>
          <input id="pwd" type="password" placeholder="重新输入密码" />
          <button onclick="login()">重试</button>
        </div>`;
        return;
      }

      if (data.length === 0) {
        app.innerHTML = `<h1>📋 聊天记录</h1>
          <div class="logout"><button onclick="logout()">退出登录</button></div>
          <div class="empty"><p style="font-size:40px;margin-bottom:12px">📭</p><p>暂无聊天记录</p></div>`;
        return;
      }

      let html = `<h1>📋 聊天记录</h1>
        <div class="refresh"><button onclick="render()">🔄 刷新</button></div>
        <div class="logout"><button onclick="logout()">退出登录</button></div>`;

      for (const day of data) {
        html += `<div class="day">
          <div class="day__header">📅 ${day.date}（${day.entries.length} 条对话）</div>
          <div class="conversation">`;
        for (const entry of day.entries) {
          html += `<div class="msg">
            <div class="msg__time">${new Date(entry.time).toLocaleTimeString('zh-CN')}</div>
            <div class="msg__label msg__label--user">👤 用户</div>
            <div class="msg__text">${escapeHtml(entry.user)}</div>
            <div class="msg__label msg__label--bot" style="margin-top:8px">🤖 AI</div>
            <div class="msg__text">${escapeHtml(entry.bot)}</div>
          </div>`;
        }
        html += `</div></div>`;
      }

      app.innerHTML = html;
    }

    render();
  </script>
</body>
</html>
